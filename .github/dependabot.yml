version: 2
updates:
  # Dependency updates go to `dev` only. `dev` is where every change lands
  # first; `main` and `beta` receive the updates with the next release and the
  # branch alignment that follows it (docs/RELEASING.md, "Branch flow").
  #
  # Do not add `main` or `beta` here. Until 2026-11 the same policy was repeated
  # for all three branches, which opened every update three times and let the
  # branches drift apart between releases.
  #
  # Dependabot reads this file from the default branch (`main`), so a change
  # here takes effect once it has reached `main`.
  #
  # npm: weekly, minor and patch bumps grouped into one PR to cut review noise.
  # Majors come as their own PRs for a deliberate look.
  - package-ecosystem: npm
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions: weekly, grouped. Keeps the SHA-pinned action references
  # the root contract requires current (VRX-149).
  - package-ecosystem: github-actions
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
