name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall hook (electron-builder install-app-deps) —
      # a no-op while there are no native deps, kept so a future native dep is
      # rebuilt against Electron's ABI automatically (audit W7).
      - name: Install dependencies
        run: npm ci

      - name: Install Linux credential probe dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-1-0 xvfb

      - name: Test Linux credential persistence across restart
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        timeout-minutes: 3
        run: |
          runtime_dir=$(mktemp -d "${RUNNER_TEMP}/vrx-runtime.XXXXXX")
          user_data_dir=$(mktemp -d "${RUNNER_TEMP}/vrx-credential-probe.XXXXXX")
          keyring_data_dir=$(mktemp -d "${RUNNER_TEMP}/vrx-keyring-data.XXXXXX")
          diagnostic_file=$(mktemp "${RUNNER_TEMP}/vrx-credential-probe-diagnostic.XXXXXX")
          chmod 700 "$runtime_dir" "$keyring_data_dir"
          cleanup() {
            rm -rf -- "$runtime_dir" "$user_data_dir" "$keyring_data_dir" "$diagnostic_file" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          export XDG_RUNTIME_DIR="$runtime_dir"
          export XDG_DATA_HOME="$keyring_data_dir"

          probe_exit=0
          timeout --kill-after=10s 90s dbus-run-session -- bash -euo pipefail -c '
            probe_stage_file=$2
            write_diagnostic() {
              printf "%s\n" "$1" >"$probe_stage_file"
            }

            if ! login_environment=$(printf "%s" "vrx-ci-keyring" | gnome-keyring-daemon --login 2>/dev/null); then
              write_diagnostic ASSERT_KEYRING_LOGIN
              exit 1
            fi
            if ! eval "$login_environment" >/dev/null 2>&1; then
              write_diagnostic ASSERT_KEYRING_LOGIN_ENV
              exit 1
            fi
            if ! start_environment=$(gnome-keyring-daemon --start --components=secrets 2>/dev/null); then
              write_diagnostic ASSERT_KEYRING_START
              exit 1
            fi
            if ! eval "$start_environment" >/dev/null 2>&1; then
              write_diagnostic ASSERT_KEYRING_START_ENV
              exit 1
            fi
            # xvfb-run merges its child's stderr into stdout. Redirect npm's
            # stderr inside the virtual-display command so the fixed probe
            # assertion reaches the private diagnostic file before that merge.
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              bash -euo pipefail -c \
                "npm --silent run test:credential-persistence-linux -- \"\$1\" >/dev/null 2>\"\$2\"" \
                bash "$1" "$probe_stage_file" \
              >/dev/null 2>&1
          ' bash "$user_data_dir" "$diagnostic_file" >/dev/null 2>&1 || probe_exit=$?

          if [ "$probe_exit" -ne 0 ]; then
            failure_label=ASSERT_LINUX_CREDENTIAL_PROBE
            case "$probe_exit" in
              124|137)
                failure_label=ASSERT_LINUX_CREDENTIAL_PROBE_TIMEOUT
                ;;
              *)
                for allowed_label in \
                  ASSERT_KEYRING_LOGIN \
                  ASSERT_KEYRING_LOGIN_ENV \
                  ASSERT_KEYRING_START \
                  ASSERT_KEYRING_START_ENV \
                  ASSERT_ARGUMENTS \
                  ASSERT_PROBE_BUILD \
                  ASSERT_LINUX_PLATFORM \
                  ASSERT_USER_DATA_ROOT \
                  ASSERT_PROBE_MARKER \
                  ASSERT_ENCRYPTION_AVAILABLE \
                  ASSERT_SECURE_BACKEND \
                  ASSERT_CREDENTIAL_SAVE \
                  ASSERT_PLAINTEXT_ABSENT \
                  ASSERT_CREDENTIAL_READ \
                  ASSERT_CREDENTIAL_CLEAR \
                  ASSERT_PROBE_EXECUTION \
                  ASSERT_PROBE_WRITE \
                  ASSERT_PROBE_READ; do
                  if grep -Fxq "$allowed_label" "$diagnostic_file"; then
                    failure_label=$allowed_label
                    break
                  fi
                done
                ;;
            esac
            printf '%s\n' "$failure_label" >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  # Dependency vulnerability gate — fails the build on high/critical advisories
  # (VRX-123). OS-agnostic, so it runs once rather than per matrix leg. `npm audit`
  # reads package-lock.json, so no install is needed (jq ships on the runner).
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Fails on any high/critical advisory EXCEPT two temporarily-allowlisted esbuild
      # advisories. Both are dev-tooling only (esbuild is a transitive build dependency
      # of vite/electron-vite and never ships in the packaged app) and have no forward
      # fix yet: the patch is esbuild 0.28.1, but vite pins esbuild ^0.27.0 and
      # electron-vite ^0.25.11, so neither resolves it and `npm audit fix --force` would
      # only downgrade electron-vite to 1.0.20. Remove the allowlist once vite +
      # electron-vite adopt esbuild >=0.28.1. Tracking: VRX-152.
      # GHSA-mh99-v99m-4gvg (brace-expansion OOM-DoS, 2026-07-26): DEV-ONLY —
      # reaches us solely through the eslint and electron-builder chains (zero
      # production reach, verified with npm ls --omit=dev); the only fix is the
      # eslint-10 / electron-builder major jumps walled behind peer deps.
      # Remove when the VRX-180 majors land. Tracking: VRX-180.
      - name: Audit dependencies
        run: |
          ALLOW='["https://github.com/advisories/GHSA-gv7w-rqvm-qjhr","https://github.com/advisories/GHSA-g7r4-m6w7-qqqr","https://github.com/advisories/GHSA-mh99-v99m-4gvg"]'
          # Human-readable report for the CI log (non-failing).
          npm audit --audit-level=high || true
          # Machine-readable copy (npm audit exits nonzero when vulns exist).
          report=$(npm audit --json || true)
          # Count high/critical advisories whose URL is NOT in the allowlist. Cascade
          # entries (vite/electron-vite, whose `via` is package-name strings) carry no
          # advisory object of their own, so they drop out naturally.
          filter='
            [ .vulnerabilities[].via[]
              | select(type == "object")
              | select(.severity == "high" or .severity == "critical")
              | select(.url as $u | ($allow | index($u)) | not) ]'
          unhandled=$(jq --argjson allow "$ALLOW" "$filter | length" <<< "$report")
          if [ "$unhandled" -gt 0 ]; then
            echo "::error::$unhandled high/critical advisory(ies) outside the allowlist"
            jq --argjson allow "$ALLOW" "$filter | map({title, url, severity})" <<< "$report"
            exit 1
          fi
          echo "No high/critical advisories outside the allowlist."

  # Secret scanning — fails the build if a credential, token, or key is committed
  # (VRX-153). OS-agnostic, so it runs once. gitleaks scans the full history on
  # push and the PR commits on pull_request; config + the fixture allowlist live
  # in .gitleaks.toml. gitleaks-action is free for public repositories.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit
          persist-credentials: false # don't leave the token in the runner's git config

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stable aggregate gate — THIS is the name to mark as the required status check
  # in branch protection, so the OS matrix above can evolve (e.g. VRX-102) without
  # changing the required check. `if: always()` so it reports a definitive pass/fail
  # even when a matrix leg fails (a skipped required check would block PRs forever).
  ci-success:
    name: ci-success
    needs: [build, audit, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build matrix did not succeed: ${{ needs.build.result }}"
            exit 1
          fi
          if [ "${{ needs.audit.result }}" != "success" ]; then
            echo "Dependency audit did not succeed: ${{ needs.audit.result }}"
            exit 1
          fi
          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "Secret scan did not succeed: ${{ needs.secret-scan.result }}"
            exit 1
          fi
          echo "All required CI jobs passed."
