appId: com.imperix.vrx
productName: VRX
directories:
  buildResources: build
files:
  - '!{coverage,test-results,playwright-report,blob-report,.codex,.superpowers,.fallow}/**'
  - '!**/*.{test,spec}.{ts,tsx,js,mjs,cjs}'
  - '!scripts/generate-app-icons.mjs'
  - '!docs/guide/**'
  - '!docs/design.html'
  - '!docs/glass.html'
  - '!dist/design-guide/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!out/credential-probe/**'
  - '!electron-vite.credential-probe.config.ts'
  - '!scripts/credential-persistence-probe-arguments.ts'
  - '!scripts/credential-persistence-probe.ts'
  - '!scripts/credential-persistence-probe-contract.test.ts'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml}'
  # Repository docs, contributor tooling and CI config are not part of the app.
  # LICENSE stays; CHANGELOG.md ships separately through extraResources.
  - '!*.md'
  - '!docs/**'
  - '!scripts/**'
  - '!{.coderabbit.yaml,.fallowrc.json,.gitleaks.toml,.nvmrc,vitest.config.ts}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# Include release notes as a packaged resource; there is no in-app notes viewer.
extraResources:
  - CHANGELOG.md
  - from: src/renderer/src/assets/fonts
    to: licenses/fonts
    filter:
      - LICENSE-*.txt
      - SOURCES.json
afterPack: scripts/assert-packaged-fonts.cjs
# Packaged-app Electron fuses (flipped right before signing). The renderer is
# still loaded from file://, so its file-protocol privileges stay on.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: true
win:
  icon: icon.ico
  executableName: vrx
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Imperix1155 <93307534+Imperix1155@users.noreply.github.com>
  category: Network
  synopsis: Social VR companion for VRChat and ChilloutVR
  icon: icon.png
  syncDesktopName: true
  electronUpdaterCompatibility: '>=2.16'
  desktop:
    entry:
      GenericName: Social VR Companion
      Keywords: VRChat;ChilloutVR;Social;Friends;
      StartupNotify: 'true'
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
  # Security hardening: keep the default Chromium sandbox in the desktop entry.
  # The generated AppRun handles systems where the sandbox cannot start.
  executableArgs: []
npmRebuild: false
publish:
  provider: github
  owner: Imperix1155
  repo: VRX
  # Create the release as a DRAFT (this is electron-builder's default; set
  # explicitly so nothing goes public before the publish-release job asserts the
  # assets and applies the tag-derived prerelease flag — VRX-224).
  releaseType: draft
