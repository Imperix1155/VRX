appId: com.imperix.vrx
productName: VRX
directories:
  buildResources: build
files:
  - '!{coverage,test-results,playwright-report,blob-report,.codex,.superpowers}/**'
  - '!**/*.{test,spec}.{ts,tsx,js,mjs,cjs}'
  - '!docs/guide/**'
  - '!docs/design.html'
  - '!docs/glass.html'
  - '!dist/design-guide/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!out/credential-probe/**'
  - '!electron-vite.credential-probe.config.ts'
  - '!scripts/credential-persistence-probe-arguments.ts'
  - '!scripts/credential-persistence-probe.ts'
  - '!scripts/credential-persistence-probe-contract.test.ts'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# Include release notes as a packaged resource; there is no in-app notes viewer.
extraResources:
  - CHANGELOG.md
  - from: src/renderer/src/assets/fonts
    to: licenses/fonts
    filter:
      - LICENSE-*.txt
      - SOURCES.json
afterPack: scripts/assert-packaged-fonts.cjs
win:
  executableName: vrx
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Imperix1155 <93307534+Imperix1155@users.noreply.github.com>
  category: Network
  synopsis: Social VR companion for VRChat and ChilloutVR
  icon: icon.png
  syncDesktopName: true
  electronUpdaterCompatibility: '>=2.16'
  desktop:
    entry:
      GenericName: Social VR Companion
      Keywords: VRChat;ChilloutVR;Social;Friends;
      StartupNotify: 'true'
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Imperix1155
  repo: VRX
  # Create the release as a DRAFT (this is electron-builder's default; set
  # explicitly so nothing goes public before the publish-release job asserts the
  # assets and applies the tag-derived prerelease flag — VRX-224).
  releaseType: draft
